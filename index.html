<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeWorld Apps</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(to bottom, #000000, #333333);
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 0 auto;
      max-width: 700px;
      padding: 30px 20px;
      border-radius: 10px;
      margin-top: 50px;
    }
    img.robot-tecnico {
      width: 300px !important;
      height: auto;
    }
    .buttons {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #e60000;
      color: white;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .header-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .checkbox-container {
      display: flex;
      align-items: flex-start;
      margin-top: 15px;
      cursor: pointer;
    }
    .checkbox-container input {
      margin-right: 12px;
      margin-top: 4px;
      transform: scale(1.3);
    }
    .btn-contract {
      background-color: #d35400;
      opacity: 0.3;
      pointer-events: none;
      transition: 0.3s;
    }
    .btn-contract.active {
      opacity: 1;
      pointer-events: auto;
    }
</head>
<body>
  <div class="header">
    <img src="background.png" alt="cabecera" class="header-img">
  </div>
  <div class="container">
        <!-- 2. Frase de bienvenida -->
        <h2>Bienvenid@ a NeWorld. Antes de nada, me alegra tenerte aquí y que estés leyendo esto; significa que ambos tenemos el interés de hacer de esta experiencia un buen proyecto de convivencia.</h2>
        
        <!-- 3. Imagen del Robot -->
        <img src="icon.png" alt="Icono" class="robot-tecnico">

        <!-- 4. Frase de redireccionamiento a las NORMAS -->
        <h2>Para asegurar que este proyecto funcione sobre ruedas y todos nos sintamos cómodos, en la siguiente página encontrarás unas pautas básicas de convivencia. Su lectura y aceptación serán necesarias para poder continuar con el proceso de reserva y la firma del contrato. ¡Vamos a ello!</h2>
    
        <!-- 5. Botón NORMAS -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="./Normas/index.html" style="
                background-color: #ff0000; 
                color: #ffffff; 
                font-weight: bold; 
                text-decoration: none; 
                padding: 12px 30px; 
                border-radius: 5px; 
                display: inline-block;
            ">
                Ver Normas de Convivencia →
            </a>
        </div>
    </div> <!-- Cierre del container -->
</body>
