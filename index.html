<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeWorld Apps</title>
  <style>
    .btn.clicked {
      background-color: #28a745 !important;
      transition: background-color 0.3s ease;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(to bottom, #000000, #333333);
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 0 auto;
      max-width: 700px;
      padding: 30px 20px;
      border-radius: 10px;
      margin-top: 50px;
    }
    img.robot-tecnico {
      width: 300px !important;
      height: auto;
    }
    .qr {
      margin: 20px 0;
      width: 150px;
      height: auto;
      cursor: pointer;
      border: 2px solid white;
      border-radius: 10px;
    }
    .buttons {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #e60000;
      color: white;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 40px auto;
      max-width: 900px;
      padding: 0 20px;
    }
    .image-grid img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }
    .header-img {
      width: 100%;
      height: auto;
      display: block;
    }
</head>
<body>
  <div class="header">
    <img src="background.png" alt="cabecera" class="header-img">
  </div>
  <div class="container">
        <h2>Bienvenid@ a NeWorld. Antes de nada, me alegra tenerte aquí y que estés leyendo esto; significa que ambos tenemos el interés de hacer de esta experiencia un buen proyecto de convivencia.</h2>
        
        <img src="icon.png" alt="Icono" class="robot-tecnico">

        <h2>Para asegurar que este proyecto funcione sobre ruedas y todos nos sintamos cómodos, en la siguiente página encontrarás unas pautas básicas de convivencia. Su lectura y aceptación serán necesarias para poder continuar con el proceso de reserva y la firma del contrato. ¡Vamos a ello!</h2>
    
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="./Normas/index.html" style="
                background-color: #ff0000; 
                color: #ffffff; 
                font-weight: bold; 
                text-decoration: none; 
                padding: 12px 30px; 
                border-radius: 5px; 
                display: inline-block;
            ">
                Ver Normas de Convivencia →
            </a>
        </div>
</body>
