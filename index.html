
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome2NeWorld</title>
    <style>
        body {
            background-image: url('https://github.com/decoi89/Welcome2NeWorld/blob/main/background.png');
            background-size: cover;
            background-position: center;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
        }
        .icono {
            margin-bottom: 20px;
        }
        .icono img {
            width: 80px;
        }
        .qr {
            margin: 20px 0;
        }
        .app-buttons {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            background-color: #e62429;
            color: white;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
        }
        .desktop-message {
            display: none;
            margin-top: 40px;
        }

        @media screen and (min-width: 768px) {
            .container, .qr {
                display: none;
            }
            .desktop-message {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icono">
            <img src="https://github.com/decoi89/Welcome2NeWorld/blob/main/icon.png" alt="Icono">
        </div>
        <h1>Bienvenido/a</h1>
        <p>Pulsa sobre los siguientes botones para descargar las apps.</p>

        <div class="qr">
            <p>Escanea este código QR para conectarte automáticamente a la red WiFi:</p>
            <img src="wifi_qr.png" alt="WiFi QR Code" width="250">
        </div>

        <div class="app-buttons" id="android-buttons">
            <a href="https://play.google.com/store/apps/details?id=com.tuya.smart&hl=es_419" class="btn">Tuya App</a>
            <a href="https://play.google.com/store/apps/details?id=integra.ayr.v2.beta&hl=es_419&pli=1" class="btn">int_egra App</a>
        </div>

        <div class="app-buttons" id="ios-buttons">
            <a href="https://apps.apple.com/es/app/tuya-smart/id1034649547" class="btn">Tuya App</a>
            <a href="https://apps.apple.com/es/app/int-egra/id1556238682" class="btn">int_egra App</a>
        </div>
    </div>

    <div class="desktop-message">
        <p>Esta página está diseñada para usarse desde un dispositivo móvil con NFC.</p>
    </div>

    <script>
        const ua = navigator.userAgent;
        if (/android/i.test(ua)) {
            document.getElementById("android-buttons").style.display = "flex";
        } else if (/iphone|ipad|ipod/i.test(ua)) {
            document.getElementById("ios-buttons").style.display = "flex";
        }
    </script>
</body>
</html>
